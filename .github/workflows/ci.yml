name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Run unit tests
        run: node tests/run_tests.mjs
      - name: Lint guard — no files > 800 LoC
        shell: bash
        run: |
          biggest=$(find runtime -name '*.mjs' -not -path '*/node_modules/*' -exec wc -l {} + | sort -rn | head -20)
          echo "$biggest"
          over=$(echo "$biggest" | awk '$1 > 800 && $2 != "total" { print $0 }')
          if [ -n "$over" ]; then
            echo "❌ the following files exceed the 800 LoC ceiling:"
            echo "$over"
            exit 1
          fi
